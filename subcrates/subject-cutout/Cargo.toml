[package]
name = "object-recognizer-subject-cutout"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { workspace = true }
imageproc = { workspace = true }
ort = { workspace = true }
thiserror = { workspace = true }
object-recognizer-runtime-config = { workspace = true }
object-recognizer-image-resize = { workspace = true }
jpeg-decoder = { version = "0.3", optional = true }
tracing = "0.1"

[features]
default = []
embed-u2net = []
embed-u2netp = []
# SIMD resizing (fast_image_resize) instead of the image crate's scalar resizer.
fast-resize = ["object-recognizer-image-resize/fast-resize"]
# Decode JPEGs at 1/2, 1/4 or 1/8 size (see variables::JPEG_MIN_SIDE).
jpeg-scaled = ["dep:jpeg-decoder"]
