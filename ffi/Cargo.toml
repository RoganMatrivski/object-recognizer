[package]
name = "object_recognizer_ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev.package."*"]
opt-level = 3

[dependencies]
boltffi = "0.32.1"
image.workspace = true
object_recognizer = { version = "0.1.0", path = "..", features = ["embed-u2net", "embed-u2netp", "embed-model"] }
ort = {workspace = true, features = ["load-dynamic"]}
parking_lot = "0.12.3"
serde = "1.0.229"
serde_json = "1.0.154"
