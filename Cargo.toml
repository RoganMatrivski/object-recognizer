[package]
edition = "2024"
name = "object_recognizer"
version = "0.1.0"

[features]
default = []
embed-model = ["object-recognizer-feature-extraction/embed-model"]
embed-u2net = ["object-recognizer-subject-cutout/embed-u2net"]
embed-u2netp = ["object-recognizer-subject-cutout/embed-u2netp"]

[lib]
crate-type = [
    "staticlib",
    "cdylib",
    "rlib",
]

[dependencies]
boltffi = "0.32.1"
serde_json = "1.0"
tracing = "0.1"

[dependencies.image]
workspace = true

[dependencies.object-recognizer-feature-extraction]
workspace = true
features = ["embed-model"]

[dependencies.object-recognizer-subject-cutout]
workspace = true
features = ["fast-resize"]

[dependencies.object-recognizer-vecdb]
workspace = true

[dependencies.ort]
workspace = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.thiserror]
workspace = true

[workspace]
members = [
    ".",
    "bin",
    "ffi",
    "subcrates/feature-extraction",
    "subcrates/subject-cutout",
    "subcrates/vecdb",
    "subcrates/runtime-config",
    "subcrates/image-resize",
    "ffi/tmp/test-vecdb",
]

[workspace.dependencies]
ort = "=2.0.0-rc.15"
thiserror = "1"

[workspace.dependencies.image]
version = "0.25"
features = [
    "jpeg",
    "png",
    "webp",
]
default-features = false

[workspace.dependencies.imageproc]
version = "0.27"
default-features = false

[workspace.dependencies.object-recognizer-feature-extraction]
version = "0.1.0"
path = "subcrates/feature-extraction"

[workspace.dependencies.object-recognizer-image-resize]
version = "0.1.0"
path = "subcrates/image-resize"

[workspace.dependencies.object-recognizer-runtime-config]
version = "0.1.0"
path = "subcrates/runtime-config"

[workspace.dependencies.object-recognizer-subject-cutout]
version = "0.1.0"
path = "subcrates/subject-cutout"

[workspace.dependencies.object-recognizer-vecdb]
version = "0.1.0"
path = "subcrates/vecdb"

[workspace.dependencies.object_recognizer]
version = "0.1.0"
path = "."

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
debug = 1
strip = false
