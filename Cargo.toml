[workspace]
members = [
    ".",
    "bin", "subcrates/object-recognizer-subject-cutout",
]

[package]
name = "object-recognizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ort = { version = "2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27", default-features = false }




[features]
default = []
# Embed weights in the binary (files must exist at build time):
embed-u2net = []    # models/u2net.onnx
embed-u2netp = []   # models/u2netp.onnx

[profile.dev]
opt-level = 3       # tract is very slow at opt-level 0
