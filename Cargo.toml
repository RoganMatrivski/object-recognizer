[workspace]
members = [
    ".",
    "bin", "subcrates/feature-extraction", "subcrates/subject-cutout","subcrates/vecdb",
]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27", default-features = false }
ort = { version = "2.0.0-rc.14", default-features = false, features = ["load-dynamic"] }
thiserror = "1"

object-recognizer = { version = "0.1.0", path = "." }
object-recognizer-feature-extraction = { version = "0.1.0", path = "subcrates/feature-extraction" }
object-recognizer-subject-cutout = { version = "0.1.0", path = "subcrates/subject-cutout" }
object-recognizer-vecdb = { version = "0.1.0", path = "subcrates/vecdb" }

[package]
name = "object-recognizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
object-recognizer-feature-extraction = { workspace = true, features = ["embed-model"] }
object-recognizer-subject-cutout = { workspace = true }
object-recognizer-vecdb = { workspace = true }
ort = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"





[features]
default = []
# Embed weights in the binary (files must exist at build time):
embed-u2net = ["object-recognizer-subject-cutout/embed-u2net"]    # models/u2net.onnx
embed-u2netp = ["object-recognizer-subject-cutout/embed-u2netp"]   # models/u2netp.onnx
embed-model = ["object-recognizer-feature-extraction/embed-model"]

[profile.dev]
opt-level = 3       # tract is very slow at opt-level 0
